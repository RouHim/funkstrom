name: CI/CD

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy -- -D warnings

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: cargo test

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build release binary
        run: cargo build --release

      - name: Start server
        run: nohup ./target/release/funkstrom --config e2e/ci-config.toml &

      - name: Wait for server readiness
        run: |
          for i in {1..45}; do
            STATUS=$(curl -fsS http://127.0.0.1:3002/status | jq -r '.streams[0].status // empty' || true)
            BUFFER_CHUNKS=$(curl -fsS http://127.0.0.1:3002/status | jq -r '.streams[0].buffer_chunks // 0' || echo 0)

            if [ "$STATUS" = "online" ] && [ "$BUFFER_CHUNKS" -gt 0 ]; then
              echo "Server ready after ${i}s (status=${STATUS}, buffer_chunks=${BUFFER_CHUNKS})"
              exit 0
            fi

            sleep 1
          done

          echo "Server did not become ready in time"
          curl -fsS http://127.0.0.1:3002/status || true
          exit 1

      - name: Prime stream endpoint
        run: |
          timeout 60 curl -s -N http://127.0.0.1:3002/stream > /dev/null 2>&1 &
          echo "STREAM_PRIMER_PID=$!" >> $GITHUB_ENV
          sleep 2

      - name: Run E2E tests
        run: ./e2e/test.sh

      - name: Stop server
        if: always()
        run: |
          if [ -n "${STREAM_PRIMER_PID}" ]; then
            kill "${STREAM_PRIMER_PID}" || true
          fi
          pkill funkstrom || true

  create-release:
    needs: [lint-format, rust-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install semantic-release
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/git \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/commit-analyzer \
            conventional-changelog-conventionalcommits

      - name: Run semantic-release
        if: github.ref == 'refs/heads/main'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    needs: [create-release]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            image: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
            name: funkstrom-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            image: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl
            name: funkstrom-aarch64-unknown-linux-musl
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/funkstrom ${{ matrix.name }}

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git ls-remote --tags https://github.com/${{ github.repository }} | grep -o 'refs/tags/[0-9]*\.[0-9]*\.[0-9]*$' | sort -V | tail -n1 | sed 's|refs/tags/||')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-container:
    needs: [lint-format, rust-tests, e2e-tests]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials are not configured; skipping image publish"
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | podman login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build container image
        if: steps.dockerhub.outputs.available == 'true'
        run: |
          podman build \
            --platform ${{ matrix.platform }} \
            --build-arg TARGETARCH=${{ matrix.arch }} \
            --tag funkstrom-${{ matrix.arch }}:latest \
            -f Containerfile .

      - name: Test container startup
        if: steps.dockerhub.outputs.available == 'true' && matrix.arch == 'amd64'
        run: |
          podman run --rm funkstrom-amd64:latest --help > /dev/null
          podman run --rm --entrypoint /ffmpeg funkstrom-amd64:latest -version > /dev/null

      - name: Push image
        if: steps.dockerhub.outputs.available == 'true'
        run: podman push funkstrom-${{ matrix.arch }}:latest docker.io/rouhim/funkstrom:${{ matrix.arch }}-latest

  push-manifest:
    needs: [build-container]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials are not configured; skipping manifest publish"
          fi

      - name: Setup Docker Buildx
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        if: steps.dockerhub.outputs.available == 'true'
        run: |
          docker buildx imagetools create -t docker.io/rouhim/funkstrom:latest \
            docker.io/rouhim/funkstrom:amd64-latest \
            docker.io/rouhim/funkstrom:arm64-latest
