<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#0c1821"/>
  
  <!-- Animated waves -->
  <path d="M 0 100 Q 100 80 200 100 T 400 100 T 600 100 T 800 100" 
        stroke="url(#grad1)" 
        stroke-width="3" 
        fill="none" 
        opacity="0.3">
    <animate attributeName="d" 
             dur="4s" 
             repeatCount="indefinite"
             values="M 0 100 Q 100 80 200 100 T 400 100 T 600 100 T 800 100;
                     M 0 100 Q 100 120 200 100 T 400 100 T 600 100 T 800 100;
                     M 0 100 Q 100 80 200 100 T 400 100 T 600 100 T 800 100"/>
  </path>
  
  <path d="M 0 110 Q 100 90 200 110 T 400 110 T 600 110 T 800 110" 
        stroke="url(#grad1)" 
        stroke-width="2" 
        fill="none" 
        opacity="0.2">
    <animate attributeName="d" 
             dur="3s" 
             repeatCount="indefinite"
             values="M 0 110 Q 100 90 200 110 T 400 110 T 600 110 T 800 110;
                     M 0 110 Q 100 130 200 110 T 400 110 T 600 110 T 800 110;
                     M 0 110 Q 100 90 200 110 T 400 110 T 600 110 T 800 110"/>
  </path>
  
  <!-- Broadcast tower icon -->
  <g transform="translate(85, 58) scale(0.78)" fill="#0891b2">
    <path d="M7.501,41.344c-2.929-4.254-4.652-9.396-4.652-14.953C2.849,11.817,14.661,0,29.236,0 c14.576,0,26.388,11.817,26.388,26.391c0,5.554-1.725,10.699-4.653,14.953c1.8-3.412,2.824-7.294,2.824-11.422 c0-13.559-10.99-24.556-24.559-24.556c-13.569,0-24.559,10.997-24.559,24.556C4.677,34.05,5.708,37.932,7.501,41.344z M43.657,27.142c0-7.958-6.455-14.421-14.421-14.421c-7.965,0-14.421,6.463-14.421,14.421c0,2.385,0.631,4.594,1.652,6.572 c-0.358-1.211-0.613-2.468-0.613-3.794c0-7.386,5.984-13.379,13.382-13.379s13.381,5.991,13.381,13.379 c0,1.327-0.246,2.583-0.611,3.794C43.028,31.731,43.657,29.525,43.657,27.142z M29.236,22.763c-2.418,0-4.375,1.959-4.375,4.375 c0,2.42,1.957,4.377,4.375,4.377s4.375-1.957,4.375-4.377C33.611,24.722,31.654,22.763,29.236,22.763z M19.029,58.473l5.195-24.8 H34.25l5.199,24.8h-2.845l-0.867-4.17H22.746l-0.871,4.17H19.029z M25.292,42.136h7.892l-1.19-5.688H26.48L25.292,42.136z M23.325,51.521h11.824l-1.383-6.602h-9.062L23.325,51.521z"/>
  </g>
  
  <!-- Funkstrom text -->
  <text x="200" y="95" 
        font-family="'Courier New', monospace" 
        font-size="48" 
        font-weight="bold" 
        fill="url(#grad1)" 
        filter="url(#glow)">Funkstrom</text>
  
  <!-- Tagline -->
  <text x="200" y="120" 
        font-family="'Courier New', monospace" 
        font-size="14" 
        fill="#cffafe"
        letter-spacing="2">HOME INTERNET RADIO SERVER</text>
  
  <!-- Sound waves -->
  <g transform="translate(680, 100)" opacity="0.6">
    <path d="M 0 0 Q 10 -15 20 0 Q 10 15 0 0" 
          fill="none" 
          stroke="#1e40af" 
          stroke-width="2">
      <animateTransform attributeName="transform"
                        type="scale"
                        values="1;1.2;1"
                        dur="1.5s"
                        repeatCount="indefinite"/>
    </path>
    <path d="M 25 0 Q 35 -20 45 0 Q 35 20 25 0" 
          fill="none" 
          stroke="#1e40af" 
          stroke-width="2">
      <animateTransform attributeName="transform"
                        type="scale"
                        values="1;1.2;1"
                        dur="1.5s"
                        begin="0.3s"
                        repeatCount="indefinite"/>
    </path>
    <path d="M 50 0 Q 60 -25 70 0 Q 60 25 50 0" 
          fill="none" 
          stroke="#1e40af" 
          stroke-width="2">
      <animateTransform attributeName="transform"
                        type="scale"
                        values="1;1.2;1"
                        dur="1.5s"
                        begin="0.6s"
                        repeatCount="indefinite"/>
    </path>
  </g>
</svg>
