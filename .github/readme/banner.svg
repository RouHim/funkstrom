<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="#0c1821"/>
  
  <!-- Animated waves -->
  <path d="M 0 100 Q 100 80 200 100 T 400 100 T 600 100 T 800 100" 
        stroke="url(#grad1)" 
        stroke-width="3" 
        fill="none" 
        opacity="0.3">
    <animate attributeName="d" 
             dur="4s" 
             repeatCount="indefinite"
             values="M 0 100 Q 100 80 200 100 T 400 100 T 600 100 T 800 100;
                     M 0 100 Q 100 120 200 100 T 400 100 T 600 100 T 800 100;
                     M 0 100 Q 100 80 200 100 T 400 100 T 600 100 T 800 100"/>
  </path>
  
  <path d="M 0 110 Q 100 90 200 110 T 400 110 T 600 110 T 800 110" 
        stroke="url(#grad1)" 
        stroke-width="2" 
        fill="none" 
        opacity="0.2">
    <animate attributeName="d" 
             dur="3s" 
             repeatCount="indefinite"
             values="M 0 110 Q 100 90 200 110 T 400 110 T 600 110 T 800 110;
                     M 0 110 Q 100 130 200 110 T 400 110 T 600 110 T 800 110;
                     M 0 110 Q 100 90 200 110 T 400 110 T 600 110 T 800 110"/>
  </path>
  
  <!-- Broadcast wave icon -->
  <g transform="translate(80, 45) scale(0.55)">
    <circle cx="64" cy="84" r="5" fill="#0891b2"/>
    <path d="M 44 82 A 20 20 0 0 0 84 82" stroke="#0891b2" stroke-width="6" stroke-linecap="round"/>
    <path d="M 30 82 A 34 34 0 0 0 98 82" stroke="#0891b2" stroke-width="5" stroke-linecap="round"/>
    <path d="M 16 82 A 48 48 0 0 0 112 82" stroke="#0891b2" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Funkstrom text -->
  <text x="200" y="95" 
        font-family="'Courier New', monospace" 
        font-size="48" 
        font-weight="bold" 
        fill="url(#grad1)" 
        filter="url(#glow)">Funkstrom</text>
  
  <!-- Tagline -->
  <text x="200" y="120" 
        font-family="'Courier New', monospace" 
        font-size="14" 
        fill="#cffafe"
        letter-spacing="2">HOME INTERNET RADIO SERVER</text>
  
  <!-- Sound waves -->
  <g transform="translate(680, 100)" opacity="0.6">
    <path d="M 0 0 Q 10 -15 20 0 Q 10 15 0 0" 
          fill="none" 
          stroke="#1e40af" 
          stroke-width="2">
      <animateTransform attributeName="transform"
                        type="scale"
                        values="1;1.2;1"
                        dur="1.5s"
                        repeatCount="indefinite"/>
    </path>
    <path d="M 25 0 Q 35 -20 45 0 Q 35 20 25 0" 
          fill="none" 
          stroke="#1e40af" 
          stroke-width="2">
      <animateTransform attributeName="transform"
                        type="scale"
                        values="1;1.2;1"
                        dur="1.5s"
                        begin="0.3s"
                        repeatCount="indefinite"/>
    </path>
    <path d="M 50 0 Q 60 -25 70 0 Q 60 25 50 0" 
          fill="none" 
          stroke="#1e40af" 
          stroke-width="2">
      <animateTransform attributeName="transform"
                        type="scale"
                        values="1;1.2;1"
                        dur="1.5s"
                        begin="0.6s"
                        repeatCount="indefinite"/>
    </path>
  </g>
</svg>
