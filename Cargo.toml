[package]
name = "funkstrom"
version = "0.1.0"
edition = "2021"
description = "Icecast-compatible internet radio server"
authors = ["Rouven Himmelstein"]
license = "MIT"
keywords = ["radio", "icecast", "streaming", "audio"]
categories = ["multimedia::audio", "network-programming"]

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.48"

[dependencies]
warp = "0.3"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
bytes = "1.0"
audiotags = "0.5"
serde_json = "1.0"
cron = "0.17.0"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
ureq = { version = "3", features = ["json"] }
fastrand = "2"
futures-core = "0.3"

[dev-dependencies]
tempfile = "3.8"
id3 = "1"

[profile.production]
inherits = "release"
codegen-units = 1
lto = true
strip = true
